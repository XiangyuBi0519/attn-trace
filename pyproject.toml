[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "attn-trace"
version = "0.3.2"
description = "Startup-time attention backend + KV cache spec logger for vLLM (works with vllm-ascend)"
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "attn-trace" }]
license = { text = "Apache-2.0" }
# vllm is intentionally NOT declared as a hard dependency: install it inside
# a container that already has vllm / vllm-ascend, and this plugin will bind
# to whatever version is present.
dependencies = []

# vLLM discovers third-party plugins via this entry-point group and calls
# the registered callable exactly once during engine startup.
[project.entry-points."vllm.general_plugins"]
attn_trace = "attn_trace.plugin:register"

[tool.setuptools.packages.find]
where = ["src"]
